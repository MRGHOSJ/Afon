apiVersion: afon.dev/flow/v1
kind: Flow
metadata:
  name: hello-app
spec:
  target:
    namespace: hello-app
  nodes:
    - id: app
      type: app-manifests
      config:
        name: hello
        image: nginx:1.27-alpine
        port: 8080
        out: generated.yaml
    - id: manifests
      type: k8s-manifests
      config:
        paths:
          - generated.yaml
    - id: deploy
      type: k8s-apply
      config:
        manifests: ${manifests.rendered}
