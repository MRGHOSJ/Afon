apiVersion: afon.dev/flow/v1
kind: Flow
metadata:
  name: hello-app
spec:
  target:
    namespace: hello-app
  nodes:
    - id: app
      type: app-manifests
      config:
        name: hello
        image: registry.example.com/your-org/hello:1.0.0  # placeholder — swap in an image you can pull
        port: 8080
        out: generated.yaml
    - id: deploy
      type: k8s-apply
      config:
        manifests: ${app.rendered}
